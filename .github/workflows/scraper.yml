name: Offline Lead Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python & Playwright Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl playwright
          python -m playwright install --with-deps chromium

      - name: Ensure Input CSV Exists
        run: |
          if [ ! -f leads_input.csv ]; then
            echo "Specialty,City" > leads_input.csv
            echo "Clinic,Abbeville" >> leads_input.csv
          fi

      - name: Run Lead Scraper Engine
        env:
          HEADLESS: "true"
        run: python -u agent.py

      - name: Upload Output Artifacts (ZIP Download)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraped-leads-files
          path: |
            leads_output.csv
            leads_output.xlsx

      - name: Commit Scraped Files
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto-update scraped leads [skip ci]" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref_name }} || echo "Push skipped"
