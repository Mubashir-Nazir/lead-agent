name: Offline Lead Scraper

on:
  workflow_dispatch: # Manual trigger
  schedule:
    - cron: '0 0 * * *' # Daily automatic run

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl playwright
          playwright install chromium
          playwright install-deps

      - name: Run Lead Scraper Engine
        env:
          HEADLESS: "true"
        run: python your_script_name.py

      - name: Commit Scraped Lead Files
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "bot@github.com"
          git add leads_output.xlsx leads_output.csv
          git commit -m "Auto-update scraped leads [skip ci]" || exit 0
          git push
