name: Offline Lead Scraper

on:
  workflow_dispatch: # Manual trigger button in GitHub Actions tab
  schedule:
    - cron: '0 0 * * *' # Automated daily execution at midnight UTC

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl playwright
          playwright install chromium
          sudo playwright install-deps chromium

      - name: Run Lead Scraper Engine
        env:
          HEADLESS: "true"
        run: python agent.py

      - name: Commit Scraped Lead Files
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "bot@github.com"
          git add -A
          git commit -m "Auto-update scraped leads [skip ci]" || exit 0
          git push
