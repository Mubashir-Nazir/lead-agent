name: Run Scraper Agent Offline (Free Gemini API)

on:
  schedule:
    - cron: '0 */6 * * *'  # Runs automatically every 6 hours
  workflow_dispatch:        # Allows manual trigger anytime from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas openai python-dotenv playwright
          playwright install-deps
          playwright install chromium

      - name: Run Scraper Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python agent.py

      - name: Commit output back to GitHub repository
        run: |
          git config --global user.name "Github Actions Bot"
          git config --global user.email "actions@github.com"
          git add leads_output.csv leads_input.csv
          git commit -m "Auto-update scraped leads" || exit 0
          git push
